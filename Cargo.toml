[package]
name = "undercurrent"
version = "0.1.0"
edition = "2021"
description = "Layered, directory-scoped lint rules that push back on agent-written code"

[[bin]]
name = "uc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json", "native-certs"] }
