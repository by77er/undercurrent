name: Undercurrent
description: Run the repository's UNDERCURRENT.md rules against a pull request
author: by77er
branding:
  icon: wind
  color: blue
inputs:
  base:
    description: Ref the change is measured against. Defaults to the pull request's base branch.
    default: ""
  rules-from:
    description: >-
      `base` loads rule files from the base branch, so a pull request cannot
      weaken the rules it is judged by. `head` loads them from the checkout.
    default: base
  all:
    description: Set to `true` to check every file instead of only changed ones.
    default: "false"
  mode:
    description: >-
      `commands` runs only command rules, `semantic` judges only semantic
      rules without executing anything from the change, `all` does both.
      `review` runs nothing: it posts the findings of the other jobs on the
      pull request as review comments, and needs `pull-requests: write`.
    default: all
  separate-instructions:
    description: >-
      Rule files must always change in pull requests of their own. Set to
      `true` to require the same of CLAUDE.md, AGENTS.md and skill files.
    default: "false"
  github-token:
    description: Token used in `review` mode to post and resolve comments.
    default: ${{ github.token }}
  typesafe-api-key:
    description: >-
      TypeSafe API key. With it, the Jev decision model does the first pass
      over semantic rules. It is never passed to command rules.
    default: ""
  anthropic-api-key:
    description: >-
      Claude API key. With it, a second reviewer confirms each flag and rules
      that span files are judged. With neither key, semantic rules are listed
      but not judged. It is never passed to command rules.
    default: ""
runs:
  using: composite
  steps:
    - name: Install uc
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        install_dir="$RUNNER_TEMP/undercurrent"
        mkdir -p "$install_dir"
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) target=linux-x86_64 ;;
          Linux-ARM64) target=linux-aarch64 ;;
          macOS-ARM64) target=macos-aarch64 ;;
          *) target="" ;;
        esac
        repository=""
        ref=""
        case "$GITHUB_ACTION_PATH" in
          */_actions/*/*/*)
            checkout="${GITHUB_ACTION_PATH#*/_actions/}"
            repository="$(printf '%s' "$checkout" | cut -d/ -f1-2)"
            ref="$(printf '%s' "$checkout" | cut -d/ -f3-)"
            ;;
        esac
        tag=""
        case "$ref" in
          v[0-9]*.[0-9]*.[0-9]*) tag="$ref" ;;
          v[0-9]*)
            tag="$(gh api "repos/$repository/releases" | jq -r --arg prefix "$ref." '[.[].tag_name | select(startswith($prefix))][0] // empty' || true)"
            ;;
        esac
        archive="uc-$target.tar.gz"
        if [ -n "$target" ] && [ -n "$tag" ] && gh release download "$tag" --repo "$repository" --pattern "$archive" --dir "$install_dir"; then
          tar -xzf "$install_dir/$archive" -C "$install_dir"
          echo "Installed uc $tag for $target."
        else
          echo "No prebuilt uc for ref '$ref' on $RUNNER_OS-$RUNNER_ARCH; building from source, which needs a Rust toolchain."
          cargo build --release --locked --manifest-path "$GITHUB_ACTION_PATH/Cargo.toml"
          cp "$GITHUB_ACTION_PATH/target/release/uc" "$install_dir/uc"
        fi
        "$install_dir/uc" --version
    - name: Restore verdict cache
      if: inputs.mode != 'commands' && inputs.mode != 'review'
      uses: actions/cache/restore@v4
      with:
        path: .git/undercurrent-cache.json
        key: undercurrent-${{ github.event.pull_request.number || github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          undercurrent-${{ github.event.pull_request.number || github.ref_name }}-
    - name: Run rules
      if: inputs.mode != 'review'
      shell: bash
      env:
        UC_BASE: ${{ inputs.base }}
        UC_RULES_FROM: ${{ inputs.rules-from }}
        UC_ALL: ${{ inputs.all }}
        UC_MODE: ${{ inputs.mode }}
        UC_SEPARATE: ${{ inputs.separate-instructions }}
        ANTHROPIC_API_KEY: ${{ inputs.mode != 'commands' && inputs.anthropic-api-key || '' }}
        TYPESAFE_API_KEY: ${{ inputs.mode != 'commands' && inputs.typesafe-api-key || '' }}
      run: |
        args=()
        base="$UC_BASE"
        if [ -z "$base" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
          base="origin/$GITHUB_BASE_REF"
        fi
        if [ -n "$base" ]; then args+=(--base "$base"); fi
        if [ "$UC_RULES_FROM" = "base" ] && [ -n "$base" ]; then args+=(--rules-from-base); fi
        if [ "$UC_ALL" = "true" ]; then args+=(--all); fi
        if [ "$UC_SEPARATE" = "true" ]; then args+=(--separate-instructions); fi
        if [ "$UC_MODE" = "commands" ]; then args+=(--skip-semantic); fi
        if [ "$UC_MODE" = "semantic" ]; then args+=(--skip-commands); fi
        args+=(--findings "$RUNNER_TEMP/undercurrent/findings-$UC_MODE.json")
        "$RUNNER_TEMP/undercurrent/uc" check "${args[@]}"
    - name: Save verdict cache
      if: always() && inputs.mode != 'commands' && inputs.mode != 'review'
      uses: actions/cache/save@v4
      with:
        path: .git/undercurrent-cache.json
        key: undercurrent-${{ github.event.pull_request.number || github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Keep the findings for the review job
      if: always() && inputs.mode != 'review'
      uses: actions/upload-artifact@v4
      with:
        name: undercurrent-findings-${{ inputs.mode }}
        path: ${{ runner.temp }}/undercurrent/findings-*.json
        if-no-files-found: ignore
    - name: Fetch the findings
      if: inputs.mode == 'review'
      uses: actions/download-artifact@v4
      with:
        pattern: undercurrent-findings-*
        path: ${{ runner.temp }}/undercurrent/findings
        merge-multiple: true
    - name: Comment on the pull request
      if: inputs.mode == 'review'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        shopt -s nullglob
        "$RUNNER_TEMP/undercurrent/uc" comment "$RUNNER_TEMP"/undercurrent/findings/*.json
