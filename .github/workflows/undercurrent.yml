name: Undercurrent

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ast-grep, which the comment rule runs
        run: npm install --global @ast-grep/cli
      - if: github.event_name == 'pull_request'
        uses: ./
        with:
          mode: commands
          separate-instructions: "true"
      - if: github.event_name == 'push'
        uses: ./
        with:
          mode: commands
          separate-instructions: "true"
          all: "true"
          rules-from: head
  semantic:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          mode: semantic
          separate-instructions: "true"
          typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
  review:
    if: always() && github.event_name == 'pull_request'
    needs: [commands, semantic]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          mode: review
