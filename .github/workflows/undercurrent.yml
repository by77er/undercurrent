name: Undercurrent

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        uses: ./
      - if: github.event_name == 'push'
        uses: ./
        with:
          all: "true"
          rules-from: head
