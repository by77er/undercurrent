name: Undercurrent

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pull requests: changed files, judged by the rules on the base branch.
      - if: github.event_name == 'pull_request'
        uses: ./
      # Pushes to main: every file, judged by the rules just merged.
      - if: github.event_name == 'push'
        uses: ./
        with:
          all: "true"
          rules-from: head
